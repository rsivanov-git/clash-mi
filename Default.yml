mode: rule
log-level: error

hosts:
  ntc.party: 130.255.77.28

dns:
  enable: true
  nameserver:
    - https://dns.nextdns.io
  use-system-hosts: true

proxy-groups:
  - name: Proxy
    type: select
    use:
      - Personal

rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - DOMAIN,_test.local,REJECT

  # Kino.pub
  - DOMAIN-SUFFIX,cdntogo.net
  # Docker mirrors
  - DOMAIN-SUFFIX,mirror.gcr.io

  # Aliexpress payments
  - DOMAIN-SUFFIX,inplat-tech.com

  # OneDrive
  - DOMAIN-SUFFIX,my.microsoftpersonalcontent.com
  # Misc
  - DOMAIN-SUFFIX,vfsglobal.com
  - DOMAIN-SUFFIX,izi.me
  - DOMAIN-SUFFIX,iziyo.xyz

  # Licard
  - DOMAIN-SUFFIX,licard.com
  # Tricolor
  - DOMAIN-SUFFIX,tricolor.tv

  # Misc
  - DOMAIN-SUFFIX,wylsa.com
  - DOMAIN-SUFFIX,wishmaster.me
  - DOMAIN-SUFFIX,quantum-a.io
  - DOMAIN-SUFFIX,lmru.tech
  - DOMAIN-SUFFIX,imdt.pro

  # Russia
  - GEOSITE,RU,DIRECT
  - GEOIP,RU,DIRECT,no-resolve

  # Everything else
  - MATCH,Proxy
